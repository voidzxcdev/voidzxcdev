name: Update Cursor Days

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README cursor days
        run: |
          python3 - << 'PY'
          import re
          from datetime import date

          start = date(2025, 10, 31)
          days = (date.today() - start).days

          with open('README.md', 'r') as f:
              content = f.read()

          new_content, n = re.subn(
              r'(\d+)\+ days on Cursor',
              f'{days}+ days on Cursor',
              content
          )

          if n:
              with open('README.md', 'w') as f:
                  f.write(new_content)
              print(f'Updated to {days}+ days')
          else:
              print('Marker not found')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update cursor days" && git push)
