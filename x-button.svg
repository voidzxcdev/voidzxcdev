<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" width="210" height="64" role="img" aria-label="@thevoidzxc">
  <defs>
    <linearGradient id="sky-x-button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3C9CE6"/>
      <stop offset="45%" stop-color="#7EC4F5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow-x-button" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="cloud-blur-x-button" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
    <filter id="text-glow-x-button" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#003366" flood-opacity="0.35"/>
    </filter>
    <clipPath id="pill-x-button">
      <rect width="210" height="64" rx="32"/>
    </clipPath>
  </defs>
  <rect width="210" height="64" rx="32" fill="url(#sky-x-button)" filter="url(#shadow-x-button)"/>
  <g clip-path="url(#pill-x-button)">
    <ellipse cx="46" cy="67" rx="59" ry="23" fill="#ffffff" opacity="0.9" filter="url(#cloud-blur-x-button)"/>
    <ellipse cx="136" cy="67" rx="67" ry="23" fill="#ffffff" opacity="0.85" filter="url(#cloud-blur-x-button)"/>
    <ellipse cx="193" cy="67" rx="46" ry="23" fill="#ffffff" opacity="0.9" filter="url(#cloud-blur-x-button)"/>
  </g>
  <g transform="translate(18, 13) scale(1.15)" filter="url(#text-glow-x-button)">
    <path d="M14.234 10.162L22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299l-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z" fill="#ffffff" fill-rule="evenodd"/>
